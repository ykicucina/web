<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Test</title>
<style>
.lang-zh { display: inline; }
.lang-it { display: none; }
body.lang-it .lang-zh { display: none; }
body.lang-it .lang-it { display: inline; }
</style></head>
<body>
<button onclick="document.body.classList.toggle('lang-it')">Toggle</button>
<h1>
  <span class="lang-zh">YKI Supply Hub 使用教程</span>
  <span class="lang-it">Guida d'uso — YKI Supply Hub</span>
</h1>
<p>
  <span class="lang-zh">中文</span>
  <span class="lang-it">italiano</span>
</p>
<script>
setInterval(() => {
  const h1 = document.querySelector('h1');
  document.title = 'h1=' + h1.offsetHeight + 'px ' + document.body.className;
}, 500);
</script>
</body></html>
