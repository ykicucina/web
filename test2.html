<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Test2</title>
<style>
/* 测试 1: 默认 + class toggle (跟 test-lang 一样) */
.zh-test1 { display: inline; color: green; }
.it-test1 { display: none; color: blue; }
body.lang-it .zh-test1 { display: none; }
body.lang-it .it-test1 { display: inline; }

/* 测试 2: 用 :lang() 伪类 */
.zh-test2:lang(zh) { display: inline; color: green; }
.it-test2:lang(zh) { display: none; }
.zh-test2:lang(it) { display: none; }
.it-test2:lang(it) { display: inline; color: blue; }

/* 测试 3: data 属性切换 */
[data-show="zh"] .zh-test3 { display: inline; color: green; }
[data-show="zh"] .it-test3 { display: none; }
[data-show="it"] .zh-test3 { display: none; }
[data-show="it"] .it-test3 { display: inline; color: blue; }

/* 默认 */
.zh-test2, .zh-test3 { color: green; }
.it-test2, .it-test3 { display: none; color: blue; }
</style></head>
<body>
<button onclick="toggle1()">测试1: body class</button>
<button onclick="toggle2()">测试2: :lang()</button>
<button onclick="toggle3()">测试3: data-show</button>
<hr>
<h2>方法1 (class):</h2>
<p>
  <span class="zh-test1">中文测试1</span>
  <span class="it-test1">italiano test1</span>
</p>
<h2>方法2 (:lang):</h2>
<p>
  <span class="zh-test2">中文测试2</span>
  <span class="it-test2">italiano test2</span>
</p>
<h2>方法3 (data-show):</h2>
<div id="root3" data-show="zh">
<p>
  <span class="zh-test3">中文测试3</span>
  <span class="it-test3">italiano test3</span>
</p>
</div>
<hr>
<div id="status"></div>
<script>
function toggle1() {
  document.body.classList.toggle('lang-it');
  update();
}
function toggle2() {
  const cur = document.documentElement.lang;
  document.documentElement.lang = (cur === 'it') ? 'zh' : 'it';
  update();
}
function toggle3() {
  const r = document.getElementById('root3');
  r.dataset.show = (r.dataset.show === 'it') ? 'zh' : 'it';
  update();
}
function update() {
  const status = document.getElementById('status');
  status.innerHTML = '<pre>'
    + 'body.className = ' + JSON.stringify(document.body.className) + '<br>'
    + 'html.lang = ' + JSON.stringify(document.documentElement.lang) + '<br>'
    + 'root3.data-show = ' + JSON.stringify(document.getElementById('root3').dataset.show) + '<br>'
    + '---<br>'
    + '方法1 中文 span offsetHeight = ' + document.querySelector('.zh-test1').offsetHeight + '<br>'
    + '方法1 意文 span offsetHeight = ' + document.querySelector('.it-test1').offsetHeight + '<br>'
    + '方法1 p offsetHeight = ' + document.querySelector('.zh-test1').parentNode.offsetHeight + '<br>'
    + '---<br>'
    + '方法2 中文 offsetHeight = ' + document.querySelector('.zh-test2').offsetHeight + '<br>'
    + '方法2 意文 offsetHeight = ' + document.querySelector('.it-test2').offsetHeight + '<br>'
    + '---<br>'
    + '方法3 中文 offsetHeight = ' + document.querySelector('.zh-test3').offsetHeight + '<br>'
    + '方法3 意文 offsetHeight = ' + document.querySelector('.it-test3').offsetHeight + '<br>'
    + '---<br>'
    + 'navigator.userAgent = ' + navigator.userAgent + '<br>'
    + 'window.innerWidth = ' + window.innerWidth
    + '</pre>';
}
update();
</script>
</body></html>
