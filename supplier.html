<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#a67c2d">
<title>YKI Supplier Portal</title>
<link rel="icon" type="image/png" href="/icon.png">
<style>
:root {
  --bg: #f0ebe3;
  --surface: #FFFFFF;
  --surface2: #f7f3ec;
  --border: #e5ddd0;
  --primary: #a67c2d;
  --primary-light: #faf6ec;
  --primary-dark: #6b4f1a;
  --success: #16a34a;
  --success-light: #f0fdf4;
  --danger: #dc2626;
  --warning: #d97706;
  --text: #1A202C;
  --text2: #4A5568;
  --text3: #8b96a8;
  --primary-shadow: rgba(107, 79, 26, 0.32);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 14px; -webkit-font-smoothing: antialiased; }
body { padding-bottom: 70px; min-height: 100vh; }

/* ============= 顶部导航 ============= */
.nav-top {
  position: sticky; top: 0; z-index: 50;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 14px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.nav-title {
  font-size: 16px; font-weight: 700; color: var(--text);
  display: flex; align-items: center; gap: 8px;
}
.nav-title .badge {
  font-size: 11px; background: var(--primary); color: #fff;
  padding: 2px 6px; border-radius: 6px; font-weight: 600;
}
.lang-switch {
  font-size: 12px; background: var(--surface2); border: 1px solid var(--border);
  padding: 4px 8px; border-radius: 6px; cursor: pointer; color: var(--text2);
}

/* ============= 底部 Tab ============= */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
  background: var(--surface); border-top: 1px solid var(--border);
  display: flex; padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
}
.tabbar-item {
  flex: 1; text-align: center;
  font-size: 11px; color: var(--text3);
  padding: 8px 0; cursor: pointer; transition: color 0.18s;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.tabbar-item .icon { font-size: 22px; line-height: 1; }
.tabbar-item.active { color: var(--primary); font-weight: 600; }

/* ============= 通用 ============= */
.wrap { padding: 12px; max-width: 720px; margin: 0 auto; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
.card-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.btn {
  border: none; border-radius: 10px; padding: 10px 14px; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: opacity 0.15s, transform 0.05s;
  font-family: inherit;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-ghost { background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--border); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-sm { padding: 6px 10px; font-size: 12px; }
.btn-block { display: block; width: 100%; }

.field-label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); margin-top: 12px; margin-bottom: 4px; }
input[type=text], input[type=password], input[type=number], input[type=email], textarea, select {
  width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); color: var(--text); font-size: 14px; font-family: inherit;
  -webkit-appearance: none; appearance: none;
}
input:focus, textarea:focus, select:focus { outline: 2px solid var(--primary); outline-offset: -1px; }

.empty {
  text-align: center; padding: 40px 16px; color: var(--text3);
}
.empty .big-icon { font-size: 48px; opacity: 0.4; margin-bottom: 8px; }

.badge-status {
  display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600;
}
.badge-sent { background: #fef3c7; color: #92400e; }
.badge-received { background: #d1fae5; color: #065f46; }

/* ============= 登录页 ============= */
#login-screen {
  min-height: 100vh; display: flex; flex-direction: column;
  justify-content: center; align-items: center; padding: 20px;
  background: linear-gradient(135deg, var(--primary-light) 0%, var(--bg) 100%);
}
.login-card {
  background: var(--surface); border-radius: 16px; padding: 28px 24px;
  width: 100%; max-width: 360px; box-shadow: 0 6px 24px rgba(0,0,0,0.06);
}
.login-brand { text-align: center; margin-bottom: 22px; }
.login-brand-name { font-size: 26px; font-weight: 800; color: var(--primary); letter-spacing: 1px; }
.login-brand-sub { font-size: 12px; color: var(--text3); margin-top: 4px; letter-spacing: 1px; }
.login-version { text-align: center; font-size: 11px; color: var(--text3); margin-top: 14px; }

/* ============= 子 tab(订单页用)============= */
.subtab {
  display: flex; background: var(--surface); border-radius: 10px;
  border: 1px solid var(--border); padding: 4px; margin-bottom: 12px; gap: 4px;
}
.subtab-item {
  flex: 1; text-align: center; padding: 8px; border-radius: 8px;
  font-size: 13px; color: var(--text2); cursor: pointer; transition: all 0.15s;
}
.subtab-item.active { background: var(--primary); color: #fff; font-weight: 600; }

/* ============= Modal ============= */
.modal-overlay {
  display: none; position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,0.4); justify-content: center; align-items: flex-end;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--surface); width: 100%; max-width: 480px;
  border-radius: 16px 16px 0 0; padding: 20px; max-height: 88vh; overflow-y: auto;
  animation: slide-up 0.22s ease;
}
@keyframes slide-up { from { transform: translateY(40px); opacity: 0.5; } to { transform: translateY(0); opacity: 1; } }
.modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: -8px auto 12px; }
.modal-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.modal-sub { font-size: 12.5px; color: var(--text3); margin-bottom: 12px; }
.modal-btns { display: flex; gap: 8px; margin-top: 18px; }
.modal-btns .btn { flex: 1; }

/* PC 端居中 */
@media (min-width: 700px) {
  .modal-overlay { align-items: center; }
  .modal { border-radius: 16px; max-height: 90vh; }
}

/* ============= 桌面端布局 (≥ 900px) ============= */
@media (min-width: 900px) {
  body { padding-bottom: 0; }
  /* 整体两栏:左侧 sidebar + 主内容区 */
  #main-screen.layout-desktop {
    display: grid;
    grid-template-columns: 220px 1fr;
    grid-template-rows: auto 1fr;
    grid-template-areas: "top top" "side main";
    min-height: 100vh;
  }
  #main-screen.layout-desktop .nav-top { grid-area: top; }
  #main-screen.layout-desktop .sidebar { grid-area: side; display: flex; }
  #main-screen.layout-desktop .main-area { grid-area: main; overflow-y: auto; max-height: calc(100vh - 56px); }
  /* 隐藏底部 tab */
  #main-screen.layout-desktop .tabbar { display: none; }
  /* 隐藏浮动按钮 */
  #main-screen.layout-desktop .fab { display: none !important; }

  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 16px 10px;
    flex-direction: column;
    gap: 4px;
  }
  .sidebar-item {
    padding: 10px 14px; border-radius: 10px; cursor: pointer;
    font-size: 14px; color: var(--text2);
    display: flex; align-items: center; gap: 10px;
    transition: background 0.15s, color 0.15s;
  }
  .sidebar-item:hover { background: var(--surface2); }
  .sidebar-item.active { background: var(--primary-light); color: var(--primary-dark); font-weight: 600; }
  .sidebar-item .icon { font-size: 18px; }

  /* 主内容区限宽 */
  .main-area .wrap { max-width: 1280px; padding: 20px 24px; }

  /* Gmail 式两栏:订单列表 + 详情 */
  .orders-twocol {
    display: grid;
    grid-template-columns: minmax(360px, 480px) 1fr;
    gap: 16px;
    align-items: start;
  }
  .orders-twocol .orders-left { min-width: 0; }
  .orders-twocol .orders-right {
    position: sticky; top: 76px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    max-height: calc(100vh - 96px);
    overflow-y: auto;
  }

  /* 桌面端订单详情 modal 隐藏(用右栏代替) */
  body.desktop #modal-order-detail { display: none !important; }

  /* 订单表格视图 */
  .orders-table {
    width: 100%; background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; border-collapse: collapse;
  }
  .orders-table th {
    background: var(--surface2); padding: 10px 12px;
    text-align: left; font-size: 12px; color: var(--text3);
    font-weight: 600; border-bottom: 1px solid var(--border);
  }
  .orders-table td {
    padding: 10px 12px; border-bottom: 1px solid var(--border);
    font-size: 13px; vertical-align: middle;
  }
  .orders-table tr:last-child td { border-bottom: none; }
  .orders-table tr.active td { background: var(--primary-light); }
  .orders-table tbody tr { cursor: pointer; transition: background 0.12s; }
  .orders-table tbody tr:hover { background: var(--surface2); }

  /* 视图切换按钮 */
  .view-toggle {
    display: inline-flex; background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; padding: 2px;
    margin-left: 10px;
  }
  .view-toggle button {
    border: none; background: transparent; padding: 4px 10px;
    border-radius: 6px; cursor: pointer; font-size: 12px;
    color: var(--text3);
  }
  .view-toggle button.active { background: var(--primary); color: #fff; }

  /* 产品页桌面端用表格 */
  .catalog-table {
    width: 100%; background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; border-collapse: collapse;
  }
  .catalog-table th { background: var(--surface2); padding: 10px 12px; text-align: left; font-size: 12px; color: var(--text3); font-weight: 600; border-bottom: 1px solid var(--border); }
  .catalog-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
  .catalog-table tr:last-child td { border-bottom: none; }
  .catalog-table tbody tr { cursor: pointer; }
  .catalog-table tbody tr:hover { background: var(--surface2); }

  /* "我的"页用更大的卡片 */
  #page-me .card { max-width: 600px; }
}

/* 移动端隐藏 sidebar */
@media (max-width: 899px) {
  .sidebar { display: none !important; }
  .orders-twocol .orders-right { display: none !important; }
  .orders-twocol { display: block; }
  .view-toggle { display: none !important; }
}

/* ============= Toast ============= */
#toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: var(--text); color: #fff; padding: 10px 16px; border-radius: 10px;
  font-size: 13px; z-index: 200; opacity: 0; transition: all 0.25s;
  max-width: 80%; text-align: center;
}
#toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
#toast.err { background: var(--danger); }
#toast.ok { background: var(--success); }

/* ============= 订单/产品卡片 ============= */
.order-card { cursor: pointer; transition: background 0.15s; }
.order-card:active { background: var(--surface2); }
.order-card .restaurant { font-weight: 700; font-size: 15px; color: var(--text); }
.order-card .meta { font-size: 12px; color: var(--text3); margin-top: 4px; }
.order-card .item-count { font-size: 13px; color: var(--text2); margin-top: 6px; }

.catalog-search {
  display: flex; gap: 8px; margin-bottom: 12px;
}
.catalog-search input { flex: 1; }

.catalog-item {
  border-bottom: 1px solid var(--border); padding: 12px 0;
  display: flex; gap: 10px; align-items: flex-start; cursor: pointer;
}
.catalog-item:last-child { border-bottom: none; }
.catalog-item .name { font-weight: 600; }
.catalog-item .sub { font-size: 12px; color: var(--text3); margin-top: 2px; }
.catalog-item .price { font-weight: 700; color: var(--primary); }

/* 浮动添加按钮 */
.fab {
  position: fixed; bottom: calc(80px + env(safe-area-inset-bottom)); right: 16px;
  width: 56px; height: 56px; border-radius: 28px; background: var(--primary); color: #fff;
  font-size: 28px; display: flex; align-items: center; justify-content: center;
  border: none; cursor: pointer; box-shadow: 0 4px 14px var(--primary-shadow);
  z-index: 40;
}
.fab:active { transform: scale(0.92); }

</style>
</head>
<body>

<!-- ============= 登录页 ============= -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-brand">
      <img src="/logo.png" alt="YKI" style="height:64px;width:auto;display:inline-block;margin-bottom:6px;">
      <div class="login-brand-sub">YKI SUPPLIER PORTAL</div>
    </div>
    <label class="field-label" data-i18n="login_supplier">供应商代号</label>
    <input id="login-supplier" type="text" placeholder="HD / METRO / ..." autocomplete="username">
    <label class="field-label" data-i18n="login_username">用户名</label>
    <input id="login-username" type="text" autocomplete="username">
    <label class="field-label" data-i18n="login_password">密码</label>
    <input id="login-password" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn btn-primary btn-block" style="margin-top:18px;" onclick="doLogin()" id="login-btn">
      <span data-i18n="login_button">登录</span>
    </button>
    <div class="login-version" id="login-version"></div>
    <div style="text-align:center;margin-top:10px;">
      <button class="lang-switch" onclick="toggleLang()">🌐 中文 / Italiano</button>
    </div>
  </div>
</div>

<!-- ============= 主界面 ============= -->
<div id="main-screen" style="display:none;" class="layout-desktop">
  <div class="nav-top">
    <div class="nav-title">
      <img src="/logo.png" alt="YKI" style="height:24px;width:auto;">
      <span class="badge" id="nav-sup-name">—</span>
      <span id="nav-page-title" style="font-weight:normal;color:var(--text2);font-size:14px;"></span>
    </div>
    <button class="lang-switch" onclick="toggleLang()">🌐</button>
  </div>

  <!-- 桌面端侧边栏 -->
  <div class="sidebar">
    <div class="sidebar-item active" data-page="orders" onclick="switchPage('orders')">
      <span class="icon">📋</span>
      <span data-i18n="tab_orders">订单</span>
    </div>
    <div class="sidebar-item" data-page="catalog" onclick="switchPage('catalog')">
      <span class="icon">📦</span>
      <span data-i18n="tab_catalog">产品</span>
    </div>
    <div class="sidebar-item" data-page="me" onclick="switchPage('me')">
      <span class="icon">👤</span>
      <span data-i18n="tab_me">我的</span>
    </div>
  </div>

  <div class="main-area">
  <div class="wrap">
    <!-- 订单页 -->
    <div id="page-orders" class="page">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
        <div class="subtab" style="flex:1;margin-bottom:0;min-width:240px;">
          <div class="subtab-item active" data-status="" onclick="setOrderStatusFilter('')">
            <span data-i18n="all_orders">全部</span>
          </div>
          <div class="subtab-item" data-status="已发送" onclick="setOrderStatusFilter('已发送')">
            <span data-i18n="status_sent">已发送</span>
          </div>
          <div class="subtab-item" data-status="已收货" onclick="setOrderStatusFilter('已收货')">
            <span data-i18n="status_received">已收货</span>
          </div>
        </div>
        <div class="view-toggle">
          <button id="vt-card" class="active" onclick="setOrderViewMode('card')" data-i18n="view_card">📋 卡片</button>
          <button id="vt-table" onclick="setOrderViewMode('table')" data-i18n="view_table">📊 表格</button>
        </div>
      </div>

      <div class="orders-twocol">
        <div class="orders-left">
          <div id="orders-list">
            <div class="empty"><div class="big-icon">⏳</div><span data-i18n="loading">加载中…</span></div>
          </div>
        </div>
        <div class="orders-right" id="orders-detail-panel">
          <div class="empty">
            <div class="big-icon">👈</div>
            <div data-i18n="select_order_to_view">选择左边一条订单查看详情</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 产品页 -->
    <div id="page-catalog" class="page" style="display:none;">
      <div class="catalog-search">
        <input id="catalog-search-input" type="text" placeholder="搜索产品名…" oninput="renderCatalog()">
        <button class="btn btn-ghost btn-sm" onclick="openImportDialog()" data-i18n="import_excel">📥 导入</button>
      </div>
      <div id="catalog-list">
        <div class="empty"><div class="big-icon">⏳</div><span data-i18n="loading">加载中…</span></div>
      </div>
      <button class="fab" id="catalog-fab" onclick="openCatalogEdit(null)" title="添加产品">+</button>
    </div>

    <!-- 我的页 -->
    <div id="page-me" class="page" style="display:none;">
      <div class="card">
        <div style="font-size:13px;color:var(--text3);margin-bottom:4px;" data-i18n="my_company">我的公司</div>
        <div id="me-company-name" style="font-size:18px;font-weight:700;"></div>
        <div id="me-company-display" style="font-size:13px;color:var(--text2);margin-top:4px;"></div>
        <div style="margin-top:14px;">
          <div class="field-label" data-i18n="contact">联系方式</div>
          <div id="me-contact-view" style="font-size:14px;color:var(--text);padding:4px 0;"></div>
        </div>
        <div style="margin-top:8px;">
          <div class="field-label" data-i18n="notes">备注</div>
          <div id="me-notes-view" style="font-size:13px;color:var(--text2);padding:4px 0;white-space:pre-wrap;"></div>
        </div>
        <button class="btn btn-ghost btn-sm" style="margin-top:14px;" onclick="openProfileEdit()" id="me-edit-btn" data-i18n="edit">✏️ 编辑</button>
      </div>
      <div class="card">
        <div style="font-size:13px;color:var(--text3);" data-i18n="account">账号</div>
        <div id="me-user-name" style="font-size:15px;font-weight:600;margin-top:4px;"></div>
        <div id="me-user-role" style="font-size:12px;color:var(--text3);margin-top:2px;"></div>
      </div>
      <button class="btn btn-ghost btn-block" style="margin-top:10px;" onclick="doLogout()">
        <span data-i18n="logout">退出登录</span>
      </button>
      <div style="text-align:center;font-size:11px;color:var(--text3);margin-top:14px;">
        YKI Supplier Portal <span id="me-version"></span>
      </div>
    </div>
  </div>
  </div>

  <!-- 底部 Tab (移动端) -->
  <div class="tabbar">
    <div class="tabbar-item active" data-page="orders" onclick="switchPage('orders')">
      <span class="icon">📋</span>
      <span data-i18n="tab_orders">订单</span>
    </div>
    <div class="tabbar-item" data-page="catalog" onclick="switchPage('catalog')">
      <span class="icon">📦</span>
      <span data-i18n="tab_catalog">产品</span>
    </div>
    <div class="tabbar-item" data-page="me" onclick="switchPage('me')">
      <span class="icon">👤</span>
      <span data-i18n="tab_me">我的</span>
    </div>
  </div>
</div>

<!-- ============= 订单详情 Modal ============= -->
<div class="modal-overlay" id="modal-order-detail">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="od-title">订单详情</div>
    <div class="modal-sub" id="od-sub"></div>
    <div id="od-content" style="margin-top:12px;"></div>
    <div class="modal-btns">
      <button class="btn btn-ghost btn-block" onclick="closeModal('modal-order-detail')" data-i18n="close">关闭</button>
    </div>
  </div>
</div>

<!-- ============= 产品编辑 Modal ============= -->
<div class="modal-overlay" id="modal-catalog-edit">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="ce-title" data-i18n="add_product">+ 添加产品</div>
    <input type="hidden" id="ce-id">

    <label class="field-label" data-i18n="prod_name_zh">中文名</label>
    <input id="ce-name" type="text" placeholder="比如:茄子">

    <label class="field-label" data-i18n="prod_name_it">意大利文名</label>
    <input id="ce-italian" type="text" placeholder="Melanzana">

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <div>
        <label class="field-label" data-i18n="prod_spec">规格</label>
        <input id="ce-spec" type="text" placeholder="500g">
      </div>
      <div>
        <label class="field-label" data-i18n="prod_unit">单位</label>
        <input id="ce-unit" type="text" placeholder="箱/包">
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">

// ============================================================
// Util

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

let _toastTimer = null;
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + type;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.className = type; }, 2800);
}

function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

async function api(path, opts = {}) {
  const headers = opts.headers || {};
  if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  if (opts.body && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
  const res = await fetch(API_URL + path, { ...opts, headers });
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (res.status === 401) {
    toast('登录已过期,请重新登录', 'err');
    setTimeout(() => doLogout(), 1500);
    throw new Error('登录已过期');
  }
  if (!res.ok) throw new Error(data.error || ('请求失败 ' + res.status));
  return data;
}

function formatDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    const pad = n => String(n).padStart(2, '0');
    const now = new Date();
    const isToday = d.toDateString() === now.toDateString();
    const yest = new Date(now); yest.setDate(yest.getDate() - 1);
    const isYest = d.toDateString() === yest.toDateString();
    const time = pad(d.getHours()) + ':' + pad(d.getMinutes());
    if (isToday) return (CURRENT_LANG === 'zh' ? '今天 ' : 'Oggi ') + time;
    if (isYest) return (CURRENT_LANG === 'zh' ? '昨天 ' : 'Ieri ') + time;
    return pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + time;
  } catch (e) { return iso; }
}

// Auth
// ============================================================
async function doLogin() {
  const supplier = document.getElementById('login-supplier').value.trim();
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  if (!supplier || !username || !password) {
    toast(CURRENT_LANG === 'zh' ? '请填写完整' : 'Compila tutti i campi', 'err');
    return;
  }
  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  try {
    const r = await fetch(API_URL + '/supplier/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ supplier, username, password }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || '登录失败');
    TOKEN = data.token;
    CURRENT_USER = data.user;
    CURRENT_SUPPLIER = data.supplier;
    localStorage.setItem(TOKEN_KEY, TOKEN);
    sessionStorage.setItem('yki_sup_user', JSON.stringify(data.user));
    sessionStorage.setItem('yki_sup_supplier', JSON.stringify(data.supplier));
    showMain();
  } catch (e) {
    toast(e.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

function doLogout() {
  TOKEN = '';
  CURRENT_USER = null;
  CURRENT_SUPPLIER = null;
  CURRENT_PROFILE = null;
  localStorage.removeItem(TOKEN_KEY);
  sessionStorage.removeItem('yki_sup_user');
  sessionStorage.removeItem('yki_sup_supplier');
  document.getElementById('main-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = '';
}

function showMain() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = '';
  document.getElementById('nav-sup-name').textContent = CURRENT_SUPPLIER.name;
  document.getElementById('me-version').textContent = APP_VERSION;
  switchPage('orders');
}

function switchPage(page) {
  CURRENT_PAGE = page;
  document.querySelectorAll('.tabbar-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });
  document.querySelectorAll('.sidebar-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });
  document.querySelectorAll('.page').forEach(el => {
    el.style.display = el.id === ('page-' + page) ? '' : 'none';
  });
  document.getElementById('nav-page-title').textContent = '· ' + t('tab_' + page);

  if (page === 'orders') loadOrders();
  else if (page === 'catalog') loadCatalog();
  else if (page === 'me') loadProfile();
}

  _orderStatusFilter = status;
  document.querySelectorAll('#page-orders .subtab-item').forEach(el => {
    el.classList.toggle('active', (el.dataset.status || '') === status);
  });
  loadOrders();
}

async function loadOrders() {
  const listEl = document.getElementById('orders-list');
  listEl.innerHTML = '<div class="empty"><div class="big-icon">⏳</div>' + t('loading') + '</div>';
  try {
    const q = _orderStatusFilter ? '?status=' + encodeURIComponent(_orderStatusFilter) : '';
    const d = await api('/supplier/orders' + q);
    ORDERS = d.orders || [];
    renderOrders();
  } catch (e) {
    listEl.innerHTML = '<div class="empty" style="color:var(--danger);">' + escapeHtml(e.message) + '</div>';
  }
}

function renderOrders() {
  const listEl = document.getElementById('orders-list');
  if (!ORDERS.length) {
    listEl.innerHTML = '<div class="empty"><div class="big-icon">📭</div>' + t('no_orders') + '</div>';
    return;
  }
  // 桌面端 + 表格视图
  if (IS_DESKTOP && _orderViewMode === 'table') {
    let html = '<table class="orders-table"><thead><tr>';
    html += '<th>#</th><th>' + t('restaurant') + '</th><th>' + t('chef') + '</th><th>' + t('items') + '</th><th>' + (CURRENT_LANG === 'zh' ? '状态' : 'Stato') + '</th><th>' + (CURRENT_LANG === 'zh' ? '时间' : 'Data') + '</th>';
    html += '</tr></thead><tbody>';
    for (const o of ORDERS) {
      const statusClass = o.status === '已发送' ? 'badge-sent' : 'badge-received';
      const statusLabel = o.status === '已发送' ? t('status_sent') : t('status_received');
      const isActive = _selectedOrderId === o.id;
      html += `<tr class="${isActive ? 'active' : ''}" onclick="openOrderDetail(${o.id})">
        <td>#${o.id}</td>
        <td><strong>${escapeHtml(o.restaurant_id)}</strong></td>
        <td>${escapeHtml(o.chef || o.buyer || '—')}</td>
        <td>${o.item_count}</td>
        <td><span class="badge-status ${statusClass}">${statusLabel}</span></td>
        <td>${escapeHtml(formatDate(o.created_at))}</td>
      </tr>`;
    }
    html += '</tbody></table>';
    listEl.innerHTML = html;
    return;
  }
  // 卡片视图(移动端 + 桌面端可选)
  listEl.innerHTML = ORDERS.map(o => {
    const statusClass = o.status === '已发送' ? 'badge-sent' : 'badge-received';
    const statusLabel = o.status === '已发送' ? t('status_sent') : t('status_received');
    const isActive = IS_DESKTOP && _selectedOrderId === o.id;
    return `
      <div class="card order-card" style="${isActive ? 'border-color:var(--primary);background:var(--primary-light);' : ''}" onclick="openOrderDetail(${o.id})">
        <div class="card-row">
          <div style="flex:1;">
            <div class="restaurant">${escapeHtml(o.restaurant_id)}</div>
            <div class="meta">${escapeHtml(formatDate(o.created_at))} · ${escapeHtml(o.chef || o.buyer || '—')}</div>
            <div class="item-count">${t('items_count').replace('{n}', o.item_count)}</div>
          </div>
          <span class="badge-status ${statusClass}">${statusLabel}</span>
        </div>
      </div>
    `;
  }).join('');
}

async function openOrderDetail(orderId) {
  _selectedOrderId = orderId;
  // 桌面端:渲染到右栏 + 标记列表行选中
  if (IS_DESKTOP) {
    renderOrders();  // 刷新列表让选中行高亮
    await renderOrderDetailInPanel(orderId);
    return;
  }
  // 移动端:弹 modal
  document.getElementById('od-content').innerHTML = '<div class="empty"><div class="big-icon">⏳</div>' + t('loading') + '</div>';
  document.getElementById('od-title').textContent = '#' + orderId;
  document.getElementById('od-sub').textContent = '';
  openModal('modal-order-detail');
  try {
    const d = await api('/supplier/orders/' + orderId);
    document.getElementById('od-content').innerHTML = orderDetailHtml(d.order);
    document.getElementById('od-title').textContent = '#' + d.order.id + ' · ' + (d.order.restaurant_name || d.order.restaurant_id);
    document.getElementById('od-sub').textContent = formatDate(d.order.created_at) + ' · ' + (d.order.status === '已发送' ? t('status_sent') : t('status_received'));
  } catch (e) {
    document.getElementById('od-content').innerHTML = '<div class="empty" style="color:var(--danger);">' + escapeHtml(e.message) + '</div>';
  }
}

    const statusLabel = o.status === '已发送' ? t('status_sent') : t('status_received');
    const statusClass = o.status === '已发送' ? 'badge-sent' : 'badge-received';
    let html = '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px;">';
    html += '<div><div style="font-size:18px;font-weight:700;">#' + o.id + ' · ' + escapeHtml(o.restaurant_name || o.restaurant_id) + '</div>';
    html += '<div style="font-size:12px;color:var(--text3);margin-top:2px;">' + escapeHtml(formatDate(o.created_at)) + '</div></div>';
    html += '<span class="badge-status ' + statusClass + '">' + statusLabel + '</span>';
    html += '</div>';
    html += orderDetailHtml(o, true);
    panel.innerHTML = html;
  } catch (e) {
    panel.innerHTML = '<div class="empty" style="color:var(--danger);">' + escapeHtml(e.message) + '</div>';
  }
}

// 订单详情内容(modal 和右栏共用)
function orderDetailHtml(o, hideHeader) {
  let html = '';
  if (o.chef) html += '<div style="font-size:13px;color:var(--text2);margin-bottom:4px;">' + t('chef') + ': ' + escapeHtml(o.chef) + '</div>';
  if (o.buyer && o.buyer !== o.chef) html += '<div style="font-size:13px;color:var(--text2);margin-bottom:4px;">' + t('buyer') + ': ' + escapeHtml(o.buyer) + '</div>';
  if (o.note) html += '<div style="background:#fff8e1;color:#e65100;font-size:13px;padding:10px;border-radius:8px;margin:8px 0;border-left:3px solid #ffa726;"><div style="font-weight:600;margin-bottom:4px;">' + t('order_note') + ':</div>' + escapeHtml(o.note) + '</div>';
  html += '<div style="font-weight:600;margin-top:14px;margin-bottom:8px;">' + t('items') + ' (' + o.items.length + '):</div>';
  html += '<div style="border:1px solid var(--border);border-radius:8px;overflow:hidden;">';
  for (const it of o.items) {
    const nameStr = [it.name, it.italian].filter(Boolean).join(' / ');
    html += `<div style="padding:10px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px;">
      <div style="flex:1;">
        <div style="font-weight:600;">${escapeHtml(nameStr || '—')}</div>
        ${it.spec ? '<div style="font-size:11px;color:var(--text3);margin-top:2px;">' + escapeHtml(it.spec) + '</div>' : ''}
      </div>
      <div style="font-weight:700;color:var(--primary);font-size:16px;">×${it.need}</div>
    </div>`;
  }
  html += '</div>';
  return html;
}

// ============================================================
// Catalog
// ============================================================
async function loadCatalog() {
  const listEl = document.getElementById('catalog-list');
  listEl.innerHTML = '<div class="empty"><div class="big-icon">⏳</div>' + t('loading') + '</div>';
  try {
    const d = await api('/supplier/catalog');
    CATALOG = d.items || [];
    renderCatalog();
  } catch (e) {
    listEl.innerHTML = '<div class="empty" style="color:var(--danger);">' + escapeHtml(e.message) + '</div>';
  }
  // FAB / 导入按钮:仅 owner 可见
  const isOwner = CURRENT_USER && CURRENT_USER.role === 'owner';
  document.getElementById('catalog-fab').style.display = isOwner ? '' : 'none';
}

function renderCatalog() {
  const listEl = document.getElementById('catalog-list');
  const q = (document.getElementById('catalog-search-input').value || '').toLowerCase().trim();
  const filtered = CATALOG.filter(p => {
    if (!q) return true;
    return (p.name || '').toLowerCase().includes(q)
      || (p.italian || '').toLowerCase().includes(q)
      || (p.category || '').toLowerCase().includes(q);
  });
  if (!filtered.length) {
    listEl.innerHTML = '<div class="empty"><div class="big-icon">📦</div>' + (q ? '没找到匹配的' : t('no_catalog')) + '</div>';
    return;
  }
  // 按分类分组
  const byCat = {};
  for (const p of filtered) {
    const c = p.category || '其他';
    if (!byCat[c]) byCat[c] = [];
    byCat[c].push(p);
  }
  const cats = Object.keys(byCat).sort();
  let html = '';
  for (const c of cats) {
    html += '<div class="card" style="padding:8px 14px 4px;">';
    html += '<div style="font-size:12px;font-weight:600;color:var(--text3);padding:6px 0;border-bottom:1px solid var(--border);">' + escapeHtml(c) + ' (' + byCat[c].length + ')</div>';
    for (const p of byCat[c]) {
      const nameStr = [p.name, p.italian].filter(Boolean).join(' / ');
      const isOwner = CURRENT_USER && CURRENT_USER.role === 'owner';
      html += `<div class="catalog-item" ${isOwner ? `onclick="openCatalogEdit(${p.id})"` : ''}>
        <div style="flex:1;">
          <div class="name">${escapeHtml(nameStr || '—')} ${!p.available ? '<span style="color:var(--danger);font-size:11px;">(缺货)</span>' : ''}</div>
          <div class="sub">${p.spec ? escapeHtml(p.spec) : ''} ${p.unit ? '· ' + escapeHtml(p.unit) : ''} ${p.item_code ? '· #' + escapeHtml(p.item_code) : ''}</div>
        </div>
        ${p.price != null ? '<div class="price">€' + Number(p.price).toFixed(2) + '</div>' : ''}
      </div>`;
    }
    html += '</div>';
  }
  listEl.innerHTML = html;
}

function openCatalogEdit(id) {
  const p = id ? CATALOG.find(x => x.id === id) : null;
  document.getElementById('ce-id').value = id || '';
  document.getElementById('ce-title').textContent = p ? t('edit_product') : t('add_product');
  document.getElementById('ce-name').value = p?.name || '';
  document.getElementById('ce-italian').value = p?.italian || '';
  document.getElementById('ce-spec').value = p?.spec || '';
  document.getElementById('ce-unit').value = p?.unit || '';
  document.getElementById('ce-price').value = p?.price != null ? p.price : '';
  document.getElementById('ce-category').value = p?.category || '';
  document.getElementById('ce-item-code').value = p?.item_code || '';
  document.getElementById('ce-image-url').value = p?.image_url || '';
  document.getElementById('ce-available').checked = p ? !!p.available : true;
  document.getElementById('ce-delete-btn').style.display = p ? '' : 'none';
  openModal('modal-catalog-edit');
}

async function saveCatalogItem() {
  const id = document.getElementById('ce-id').value;
  const name = document.getElementById('ce-name').value.trim();
  const italian = document.getElementById('ce-italian').value.trim();
  if (!name && !italian) {
    toast('请填写产品名(中文或意大利文至少一个)', 'err');
    return;
  }
  const payload = {
    name, italian,
    spec: document.getElementById('ce-spec').value.trim(),
    unit: document.getElementById('ce-unit').value.trim(),
    price: document.getElementById('ce-price').value ? parseFloat(document.getElementById('ce-price').value) : null,
    category: document.getElementById('ce-category').value.trim(),
    item_code: document.getElementById('ce-item-code').value.trim(),
    image_url: document.getElementById('ce-image-url').value.trim(),
    available: document.getElementById('ce-available').checked,
  };
  if (id) payload.id = parseInt(id);
  const btn = document.getElementById('ce-save-btn');
  btn.disabled = true;
  try {
    await api('/supplier/catalog/upsert', { method: 'POST', body: JSON.stringify(payload) });
    toast(t('saved'), 'ok');
    closeModal('modal-catalog-edit');
    await loadCatalog();
  } catch (e) {
    toast(t('save_failed') + ': ' + e.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

async function deleteCatalogItem() {
  const id = document.getElementById('ce-id').value;
  if (!id) return;
  if (!confirm(t('confirm_delete'))) return;
  try {
    await api('/supplier/catalog/delete', { method: 'POST', body: JSON.stringify({ id: parseInt(id) }) });
    toast(t('deleted'), 'ok');
    closeModal('modal-catalog-edit');
    await loadCatalog();
  } catch (e) {
    toast(e.message, 'err');
  }
}

// === Excel Import ===
let _importParsedRows = [];

function openImportDialog() {
  document.getElementById('import-file').value = '';
  document.getElementById('import-preview').style.display = 'none';
  document.getElementById('import-do-btn').disabled = true;
  _importParsedRows = [];
  openModal('modal-import');
}

function onImportFileSelected() {
  const f = document.getElementById('import-file').files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = new Uint8Array(ev.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      const sheetName = wb.SheetNames[0];
      const sheet = wb.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
      // 标准化字段名(小写 + 去空格)
      const allowedKeys = ['name', 'italian', 'spec', 'unit', 'price', 'category', 'item_code'];
      const normalized = rows.map(r => {
        const out = {};
        for (const [k, v] of Object.entries(r)) {
          const norm = String(k).toLowerCase().replace(/[\s_]+/g, '').replace(/-/g, '');
          // 匹配各种可能的列名
          if (norm === 'name' || norm === '中文名' || norm === 'nome') out.name = v;
          else if (norm === 'italian' || norm === 'italiano' || norm === '意大利文') out.italian = v;
          else if (norm === 'spec' || norm === '规格' || norm === 'formato') out.spec = v;
          else if (norm === 'unit' || norm === '单位' || norm === 'unità' || norm === 'unita') out.unit = v;
          else if (norm === 'price' || norm === '价格' || norm === '单价' || norm === 'prezzo') out.price = v;
          else if (norm === 'category' || norm === '分类' || norm === 'categoria') out.category = v;
          else if (norm === 'itemcode' || norm === '货号' || norm === 'codice') out.item_code = v;
        }
        return out;
      }).filter(r => r.name || r.italian);

      if (!normalized.length) {
        toast(t('import_no_rows'), 'err');
        return;
      }
      _importParsedRows = normalized;
      // 预览前 5 条
      const previewEl = document.getElementById('import-preview-table');
      let html = '<table style="width:100%;border-collapse:collapse;"><thead><tr style="background:var(--surface2);">';
      for (const k of allowedKeys) html += '<th style="padding:4px 6px;text-align:left;border-bottom:1px solid var(--border);">' + k + '</th>';
      html += '</tr></thead><tbody>';
      for (const r of normalized.slice(0, 5)) {
        html += '<tr>';
        for (const k of allowedKeys) html += '<td style="padding:4px 6px;border-bottom:1px solid var(--border);">' + escapeHtml(r[k] || '') + '</td>';
        html += '</tr>';
      }
      html += '</tbody></table>';
      previewEl.innerHTML = html;
      document.getElementById('import-preview-title').textContent = t('import_preview').replace('{n}', normalized.length);
      document.getElementById('import-preview').style.display = '';
      document.getElementById('import-do-btn').disabled = false;
    } catch (e) {
      toast('解析失败: ' + e.message, 'err');
    }
  };
  reader.readAsArrayBuffer(f);
}

async function doImport() {
  if (!_importParsedRows.length) return;
  const strategy = document.getElementById('import-strategy').value;
  const btn = document.getElementById('import-do-btn');
  btn.disabled = true;
  try {
    const d = await api('/supplier/catalog/import', {
      method: 'POST',
      body: JSON.stringify({ rows: _importParsedRows, strategy }),
    });
    toast(
      t('import_done')
        .replace('{ins}', d.inserted || 0)
        .replace('{upd}', d.updated || 0)
        .replace('{skp}', d.skipped || 0),
      'ok'
    );
    closeModal('modal-import');
    await loadCatalog();
  } catch (e) {
    toast(e.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

// ============================================================
// Init
// ============================================================
(function init() {
  detectViewport();  // 立即识别桌面/移动
  applyI18n();
  document.getElementById('login-version').textContent = APP_VERSION;
  // 尝试用缓存的 token 自动登录
  const savedToken = localStorage.getItem(TOKEN_KEY);
  if (savedToken) {
    const savedUser = sessionStorage.getItem('yki_sup_user');
    const savedSupplier = sessionStorage.getItem('yki_sup_supplier');
    if (savedUser && savedSupplier) {
      try {
        TOKEN = savedToken;
        CURRENT_USER = JSON.parse(savedUser);
        CURRENT_SUPPLIER = JSON.parse(savedSupplier);
        showMain();
        return;
      } catch (e) {}
    }
    // sessionStorage 没了,但 token 还在:试着拉一次 profile 验证
    TOKEN = savedToken;
    fetch(API_URL + '/supplier/profile', { headers: { 'Authorization': 'Bearer ' + TOKEN } })
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(d => {
        CURRENT_PROFILE = d.profile;
        // 从 profile 推断 supplier 信息;user 信息需要重新登录
        // 简化:让用户重新登录
        TOKEN = '';
      })
      .catch(() => { TOKEN = ''; localStorage.removeItem(TOKEN_KEY); });
  }
})();
